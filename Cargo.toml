[workspace]
resolver = "2"
members = ["crates/hd-core", "crates/hd-cli", "crates/hd-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Rust rewrite of erickutcher/httpdownloader (GPLv3)"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "fs", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
md-5 = "0.10"
sha2 = "0.10"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "3"
eframe = "0.33"
arboard = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
